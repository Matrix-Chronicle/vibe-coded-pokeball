<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe Coded Poké Ball</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111827;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: #f3f4f6;
    }

    h1 {
      margin-bottom: 0.5rem;
      font-size: 1.8rem;
      letter-spacing: 0.05em;
      color: #ef4444;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
    }

    p {
      margin-top: 0;
      margin-bottom: 1.5rem;
      color: #9ca3af;
      font-size: 0.95rem;
    }

    canvas {
      background: #1f2937;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Canvas Poké Ball</h1>
  <p>Hover and click to activate</p>

  <canvas id="pokeCanvas" width="400" height="400"></canvas>

  <script>
    const canvas = document.getElementById('pokeCanvas');
    const ctx = canvas.getContext('2d');

    const center = { x: canvas.width / 2, y: canvas.height / 2 };
    const radius = 120;
    
    let isHovered = false;
    let isPressed = false;
    let pulseAngle = 0;

    function drawPokeBall() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Subtle ambient glow on hover
      if (isHovered) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(center.x, center.y, radius + 15, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(239, 68, 68, 0.15)';
        ctx.fill();
        ctx.restore();
      }

      // 1. Top Red Half
      ctx.beginPath();
      ctx.arc(center.x, center.y, radius, Math.PI, 0, false);
      ctx.fillStyle = '#ef4444';
      ctx.fill();

      // Top Highlight Gradient
      const redGlow = ctx.createLinearGradient(center.x, center.y - radius, center.x, center.y);
      redGlow.addColorStop(0, 'rgba(255, 255, 255, 0.35)');
      redGlow.addColorStop(0.8, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = redGlow;
      ctx.fill();

      // 2. Bottom White Half
      ctx.beginPath();
      ctx.arc(center.x, center.y, radius, 0, Math.PI, false);
      ctx.fillStyle = '#f9fafb';
      ctx.fill();

      // Bottom Shadow Gradient
      const whiteShadow = ctx.createLinearGradient(center.x, center.y, center.x, center.y + radius);
      whiteShadow.addColorStop(0, 'rgba(0, 0, 0, 0)');
      whiteShadow.addColorStop(1, 'rgba(0, 0, 0, 0.15)');
      ctx.fillStyle = whiteShadow;
      ctx.fill();

      // Outer Outline
      ctx.beginPath();
      ctx.arc(center.x, center.y, radius, 0, Math.PI * 2);
      ctx.lineWidth = 12;
      ctx.strokeStyle = '#111827';
      ctx.stroke();

      // 3. Middle Black Center Line
      ctx.beginPath();
      ctx.moveTo(center.x - radius + 3, center.y);
      ctx.lineTo(center.x + radius - 3, center.y);
      ctx.lineWidth = 12;
      ctx.strokeStyle = '#111827';
      ctx.stroke();

      // 4. Outer Ring Button
      ctx.beginPath();
      ctx.arc(center.x, center.y, 32, 0, Math.PI * 2);
      ctx.fillStyle = '#f9fafb';
      ctx.fill();
      ctx.lineWidth = 10;
      ctx.strokeStyle = '#111827';
      ctx.stroke();

      // 5. Inner Button
      const innerRadius = isPressed ? 14 : 16;
      ctx.beginPath();
      ctx.arc(center.x, center.y, innerRadius, 0, Math.PI * 2);
      
      if (isPressed) {
        ctx.fillStyle = '#ef4444';
      } else if (isHovered) {
        // Pulsing core effect on hover
        const pulse = Math.sin(pulseAngle) * 0.2 + 0.8;
        ctx.fillStyle = `rgba(239, 68, 68, ${pulse})`;
      } else {
        ctx.fillStyle = '#ffffff';
      }
      
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#111827';
      ctx.stroke();
    }

    function animate() {
      pulseAngle += 0.05;
      drawPokeBall();
      requestAnimationFrame(animate);
    }

    // Event Listeners for Interaction
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const dx = e.clientX - rect.left - center.x;
      const dy = e.clientY - rect.top - center.y;
      isHovered = Math.sqrt(dx * dx + dy * dy) <= radius;
    });

    canvas.addEventListener('mouseleave', () => {
      isHovered = false;
      isPressed = false;
    });

    canvas.addEventListener('mousedown', () => {
      if (isHovered) isPressed = true;
    });

    canvas.addEventListener('mouseup', () => {
      isPressed = false;
    });

    // Start loop
    animate();
  </script>
</body>
</html>
